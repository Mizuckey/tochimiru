name: Import market transactions

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "Start year"
        required: true
        default: "2021"
        type: string
      to_year:
        description: "End year"
        required: true
        default: "2026"
        type: string
      classification:
        description: "Price classification: blank=both, 01=transaction, 02=closing"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Preview without writing to Supabase"
        required: true
        default: false
        type: boolean
  schedule:
    # JST 06:10 on the first day of every month.
    - cron: "10 21 1 * *"

concurrency:
  group: import-market-transactions
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      REAL_ESTATE_INFO_LIBRARY_API_KEY: ${{ secrets.REAL_ESTATE_INFO_LIBRARY_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          test -n "$REAL_ESTATE_INFO_LIBRARY_API_KEY" || (echo "Missing REAL_ESTATE_INFO_LIBRARY_API_KEY" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN" || (echo "Missing NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN (geocoding)" && exit 1)

      - name: Import Isuzugawa market transactions
        run: |
          FROM_YEAR="${{ github.event.inputs.from_year || '2021' }}"
          TO_YEAR="${{ github.event.inputs.to_year || '2026' }}"
          CLASSIFICATION="${{ github.event.inputs.classification || '' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          CMD="npm run import:isuzugawa-prices -- --from-year=$FROM_YEAR --to-year=$TO_YEAR"

          if [ -n "$CLASSIFICATION" ]; then
            CMD="$CMD --classification=$CLASSIFICATION"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "$CMD"
          eval "$CMD"
