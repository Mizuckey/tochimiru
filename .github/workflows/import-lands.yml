name: Import lands

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Import source"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - belinda
          - soken
          - nk
          - sanco
      dry_run:
        description: "Preview without writing to Supabase"
        required: true
        default: false
        type: boolean
  schedule:
    # JST 05:20 every day. Keep this low-frequency for source sites.
    - cron: "20 20 * * *"

concurrency:
  group: import-lands
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          test -n "$NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN" || (echo "Missing NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      - name: Import lands
        run: |
          SOURCE="${{ github.event.inputs.source || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          if [ "$DRY_RUN" = "true" ]; then
            npm run import:lands -- --source="$SOURCE" --dry-run
          else
            npm run import:lands -- --source="$SOURCE"
          fi
